<title>Quinoa Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg: #120d09;
    --surface: #1d140c;
    --surface-2: #2a1d12;
    --rule: rgba(232,169,74,.26);
    --ink: #f3e7d6;
    --ink-dim: #bfa98c;
    --gold: #e8a94a;
    --ember: #c9702e;
    --cream: #f6eee0;
    --cream-ink: #2a1d12;
    --cream-ink-dim: #6f5c46;
    --focus: #e8a94a;
  }

  *{ box-sizing: border-box; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding-inline: 20px;
    padding-block: 48px;
  }

  .card{
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 28px;
    padding: 0 26px 28px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.7);
  }

  .logo-frame{
    margin: 0 -26px;
    position: relative;
    border-radius: 28px 28px 0 0;
    overflow: hidden;
    background: #000;
  }
  .logo-frame img{
    display: block;
    width: 100%;
    height: auto;
  }
  .logo-frame::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(29,20,12,0) 62%, var(--surface) 100%);
    pointer-events: none;
  }

  h1{
    margin: 18px 0 0;
    text-align: center;
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 6vw, 2.15rem);
    letter-spacing: 0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  .locale{
    margin: 6px 0 0;
    text-align: center;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .rule{
    width: 64px;
    height: 2px;
    margin: 22px auto;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--ember), var(--gold), var(--cream));
  }

  .actions{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .action{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    border-radius: 16px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    color: var(--ink);
    text-decoration: none;
  }
  .action:hover{ background: #332415; }
  .action:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }

  .icon{
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: rgba(232,169,74,.14);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
  }
  .icon svg{ width: 19px; height: 19px; }

  .action-text{ min-width: 0; }
  .action-label{
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .action-value{
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .qr-panel{
    margin-top: 22px;
    background: var(--cream);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .qr-panel img{
    width: 150px;
    height: 150px;
    display: block;
  }
  .qr-caption{
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream-ink);
  }
  .qr-sub{
    margin-top: -4px;
    font-size: 12.5px;
    color: var(--cream-ink-dim);
    text-align: center;
  }

  .foot{
    margin-top: 18px;
    text-align: center;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: .7;
  }

  @media (prefers-reduced-motion: reduce){
    .action{ transition: none; }
  }

  @media (max-width: 380px){
    .card{ padding-inline: 18px; }
    .logo-frame{ margin: 0 -18px; }
  }
</style>
